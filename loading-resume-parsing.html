<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATS Agent — Resume Parsing</title>
<style>
  :root {
    --ink: #14171F;
    --coral: #E8553D;
    --teal: #2FA88F;
    --paper: #F4F2ED;
    --muted: #3A3E48;
  }
  html, body {
    height: 100%; margin: 0; display: flex; align-items: center; justify-content: center;
    background: transparent; font-family: 'Space Grotesk','Inter',system-ui,sans-serif;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 22px; }

  .card {
    width: 168px; height: 200px; border-radius: 22px; background: var(--ink);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 40px rgba(20,23,31,0.25);
  }

  svg { overflow: visible; }

  .page-outline {
    fill: none; stroke: var(--paper); stroke-width: 3.5;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .line {
    fill: var(--muted);
    animation: read 2.6s ease-in-out infinite;
  }
  .line1 { animation-delay: 0.00s; }
  .line2 { animation-delay: 0.28s; }
  .line3 { animation-delay: 0.56s; }
  .line4 { animation-delay: 0.84s; }
  .line5 { animation-delay: 1.12s; }

  @keyframes read {
    0%, 14%   { fill: var(--muted); }
    22%       { fill: var(--teal); }
    40%, 100% { fill: var(--muted); }
  }

  .beam {
    animation: sweep 2.6s ease-in-out infinite;
  }
  @keyframes sweep {
    0%   { transform: translateY(0); opacity: 0; }
    4%   { opacity: 1; }
    88%  { opacity: 1; }
    96%  { transform: translateY(94px); opacity: 0; }
    100% { transform: translateY(94px); opacity: 0; }
  }

  .label {
    font-size: 14px; font-weight: 500; color: #5B5F6B;
  }
  .label::after {
    content: 'Reading your resume\2026';
  }

  @media (prefers-reduced-motion: reduce) {
    .beam { animation: none; opacity: 0; }
    .line { animation: none; fill: var(--teal); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <svg width="88" height="112" viewBox="0 0 88 112">
        <!-- page with folded corner -->
        <path class="page-outline"
              d="M12,8 H60 L76,24 V100 Q76,104 72,104 H16 Q12,104 12,100 V12 Q12,8 16,8 Z" />
        <path class="page-outline" d="M60,8 V24 H76" />

        <!-- text lines -->
        <rect class="line line1" x="24" y="38" width="40" height="5" rx="2.5" />
        <rect class="line line2" x="24" y="50" width="34" height="5" rx="2.5" />
        <rect class="line line3" x="24" y="62" width="38" height="5" rx="2.5" />
        <rect class="line line4" x="24" y="74" width="28" height="5" rx="2.5" />
        <rect class="line line5" x="24" y="86" width="36" height="5" rx="2.5" />

        <!-- scanning beam -->
        <g class="beam">
          <rect x="10" y="30" width="68" height="14" fill="url(#beamGradient)" />
        </g>
        <defs>
          <linearGradient id="beamGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#2FA88F" stop-opacity="0" />
            <stop offset="50%" stop-color="#2FA88F" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#2FA88F" stop-opacity="0" />
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="label"></div>
  </div>
</body>
</html>
