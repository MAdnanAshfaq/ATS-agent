<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Antigravity · Live Particle Experience</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon-v2.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Global Theme Manager (Zero-FOUC Synchronous Engine) -->
  <script src="/static/theme.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      transition: background 0.3s ease;
    }
    html[data-theme="light"], html[data-theme="light"] body {
      background: #ffffff;
      color: #090D1A;
    }
    html[data-theme="dark"], html[data-theme="dark"] body {
      background: #090B10;
      color: #F8FAFC;
    }
    .main-particles-component-section {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }
    .main-particles-container, .main-particles-container canvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Minimal Floating Controls */
    .antigravity-hud {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 9999px;
      padding: 8px 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }
    html[data-theme="dark"] .antigravity-hud {
      background: rgba(14, 18, 27, 0.85);
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .hud-title {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      letter-spacing: -0.2px;
    }
    html[data-theme="dark"] .hud-title {
      color: #f1f5f9;
    }
    .hud-btn {
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      color: #475569;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    html[data-theme="dark"] .hud-btn {
      background: #1e293b;
      border-color: #334155;
      color: #cbd5e1;
    }
    .hud-btn:hover {
      background: #2563eb;
      border-color: #2563eb;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="main-particles-component-section" 
       id="antigravity-particles"
       data-main-particles-component 
       data-theme="light" 
       data-color1="#2c64ed"
       data-color2="#f84242"
       data-color3="#ffcf03"
       data-ring-width="0.006" 
       data-ring-width2="0.107" 
       data-ring-displacement="0.62" 
       data-density="230" 
       data-particles-scale="0.59">
    <div class="main-particles-container" data-container></div>
  </div>

  <div class="antigravity-hud">
    <span class="hud-title">Google Antigravity Clone</span>
    <button class="hud-btn theme-toggle-btn" id="theme-toggle" onclick="toggleAppTheme()" title="Toggle Theme" aria-label="Toggle theme">
      <i class="fa-solid fa-sun"></i>
      <span class="theme-toggle-label">Theme</span>
    </button>
    <a href="/" class="hud-btn">← Back to ATS Agent</a>
  </div>

  <script type="module" src="/static/antigravity/MainParticlesComponent.js"></script>
</body>
</html>
