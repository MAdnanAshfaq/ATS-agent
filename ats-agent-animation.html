<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ATS Agent — Icon Animation</title>
<style>
  :root {
    --ink: #14171F;
    --coral: #E8553D;
    --teal: #2FA88F;
    --paper: #F4F2ED;
  }

  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .badge {
    width: 160px;
    height: 160px;
    border-radius: 34px;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 18px 40px rgba(20, 23, 31, 0.28);
    animation: settle 3.6s cubic-bezier(.4,0,.2,1) infinite;
  }

  svg { overflow: visible; }

  .coral-path, .teal-path {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 1 1;
    animation-duration: 3.6s;
    animation-iteration-count: infinite;
    animation-timing-function: cubic-bezier(.65,0,.35,1);
  }

  .coral-path {
    stroke: var(--coral);
    stroke-width: 7.6;
    stroke-dashoffset: 1;
    animation-name: draw-coral;
  }

  .teal-path {
    stroke: var(--teal);
    stroke-width: 8.8;
    stroke-dashoffset: 1;
    animation-name: draw-teal;
  }

  .tip {
    fill: var(--teal);
    opacity: 0;
    transform-origin: 95px 41px;
    animation: tip-pulse 3.6s cubic-bezier(.4,0,.2,1) infinite;
  }

  @keyframes draw-coral {
    0%   { stroke-dashoffset: 1; }
    8%   { stroke-dashoffset: 1; }
    32%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }

  @keyframes draw-teal {
    0%   { stroke-dashoffset: 1; }
    32%  { stroke-dashoffset: 1; }
    52%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }

  @keyframes tip-pulse {
    0%, 50%   { opacity: 0; transform: scale(0.4); }
    56%       { opacity: 1; transform: scale(1.6); }
    64%       { opacity: 0.9; transform: scale(1); }
    82%       { opacity: 0.9; transform: scale(1); }
    92%, 100% { opacity: 0; transform: scale(0.4); }
  }

  @keyframes settle {
    0%, 8%   { transform: scale(0.97); }
    52%      { transform: scale(1); }
    56%      { transform: scale(1.015); }
    64%      { transform: scale(1); }
    100%     { transform: scale(1); }
  }

  .label {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.2px;
    color: #5B5F6B;
    opacity: 0;
    animation: label-fade 3.6s cubic-bezier(.4,0,.2,1) infinite;
  }

  @keyframes label-fade {
    0%, 50%  { opacity: 0; transform: translateY(4px); }
    58%      { opacity: 1; transform: translateY(0); }
    88%      { opacity: 1; transform: translateY(0); }
    96%,100% { opacity: 0; transform: translateY(4px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .badge, .coral-path, .teal-path, .tip, .label {
      animation: none !important;
    }
    .coral-path, .teal-path { stroke-dashoffset: 0; }
    .tip { opacity: 0.9; transform: scale(1); }
    .label { opacity: 1; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="badge">
    <svg width="120" height="120" viewBox="0 0 120 120">
      <path class="coral-path"
            pathLength="1"
            d="M28,62 L38,62 L43,44 L51,76 L58,52 L63,62" />
      <path class="teal-path"
            pathLength="1"
            d="M63,62 L74,73 L95,41" />
      <circle class="tip" cx="95" cy="41" r="7" />
    </svg>
  </div>
  <div class="label">Passed</div>
</div>

</body>
</html>
